# JJ Blog - Hexo site config
title: JJ
subtitle: '自洽'
description: 'JJ 的技术博客'
keywords: technology,blog,JJ
author: JJ
language: zh-CN
timezone: Asia/Shanghai

# 线上地址（GitHub Pages 用户站）
# 本地预览仍可用: npm start → http://localhost:4000
url: https://sutong-j.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - admin/**

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map:
tag_map:

meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

per_page: 10
pagination_dir: page

theme: butterfly

# 可选：本机 hexo deploy（更推荐用 GitHub Actions 自动发布）
deploy:
  type: git
  repo: https://github.com/Sutong-J/Sutong-J.github.io.git
  branch: gh-pages
  message: 'Site updated: {{ now("YYYY-MM-DD HH:mm:ss") }}'
